<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy — Plant Monitor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  :root{
    --bg: #0E1510;
    --bg-panel: #141D17;
    --bg-panel-raised: #1A241D;
    --line: #26332B;
    --text: #EDEEE7;
    --text-dim: #9AA69C;
    --moss: #8FBF7F;
    --moss-dim: #4E6B47;
    --amber: #E8A33D;
    --amber-dim: #5C4522;
    --rust: #C7714A;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  .screen{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 20px 60px;
    display: none;
    flex-direction: column;
  }
  .screen.active{ display: flex; }

  /* ---------- Header / brand ---------- */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 32px;
  }
  .brand-mark{
    width: 30px; height:30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--moss), #4E6B47);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display);
    font-weight:700;
    color: #0E1510;
    font-size: 15px;
  }
  .brand-name{
    font-family: var(--font-display);
    font-weight:600;
    font-size: 18px;
    letter-spacing: 0.2px;
  }

  /* ---------- Auth screen ---------- */
  .auth-card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
    margin-top: 24px;
  }
  .auth-title{
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .auth-sub{
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 24px;
  }
  label{
    display:block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  input[type=email], input[type=password], input[type=text]{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus{ border-color: var(--moss); }

  .btn{
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--moss); color: #0E1510; }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    margin-top: 10px;
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--moss-dim); }

  .switch-line{
    text-align:center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .switch-line button{
    background:none; border:none; color: var(--moss);
    cursor:pointer; font-weight:600; font-size:13px;
    font-family: var(--font-body);
  }

  .err{
    color: var(--rust);
    font-size: 13px;
    margin: -8px 0 14px;
    min-height: 16px;
  }

  /* ---------- Devices list screen ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 24px;
  }
  .signout{
    background:none;border:none;color:var(--text-dim);
    font-size: 13px; cursor:pointer; font-family: var(--font-body);
  }
  .signout:hover{ color: var(--text); }

  .section-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin: 0 0 12px;
  }

  .device-card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  .device-card:hover{ border-color: var(--moss-dim); }
  .device-mac{
    font-family: var(--font-mono);
    font-size: 14px;
  }
  .device-sub{
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 3px;
  }
  .dot{
    width: 8px; height:8px; border-radius:50%;
    background: var(--moss);
    box-shadow: 0 0 0 0 rgba(143,191,127,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(143,191,127,0.45); }
    70%{ box-shadow: 0 0 0 8px rgba(143,191,127,0); }
    100%{ box-shadow: 0 0 0 0 rgba(143,191,127,0); }
  }

  .empty-state{
    color: var(--text-dim);
    font-size: 14px;
    text-align:center;
    padding: 40px 10px;
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  .add-row{
    display:flex;
    gap: 10px;
    margin-top: 20px;
  }
  .add-row input{ margin-bottom:0; flex:1; }
  .icon-btn{
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 0 16px;
    cursor:pointer;
    font-size: 18px;
  }
  .icon-btn:hover{ border-color: var(--moss-dim); }

  /* ---------- QR modal ---------- */
  .modal-backdrop{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal-backdrop.active{ display:flex; }
  .modal{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    max-width: 400px;
    width: 100%;
  }
  .modal h3{
    font-family: var(--font-display);
    margin: 0 0 12px;
    font-size: 17px;
  }
  #qr-reader{
    border-radius: 10px;
    overflow:hidden;
  }

  /* ---------- Dashboard screen ---------- */
  .back-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom: 20px;
  }
  .back-btn{
    background:none;border:none;color:var(--text-dim);
    cursor:pointer; font-size: 20px; padding:0;
  }
  .device-title{
    font-family: var(--font-mono);
    font-size: 15px;
  }

  .photo-frame{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
    margin-bottom: 16px;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit: cover; display:block;
  }
  .photo-placeholder{
    color: var(--text-dim);
    font-size: 13px;
    text-align:center;
    padding: 20px;
  }
  .condition-badge{
    position:absolute;
    top: 12px; left:12px;
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-body);
    backdrop-filter: blur(6px);
  }
  .cond-healthy{ background: rgba(143,191,127,0.85); color:#0E1510; }
  .cond-attention{ background: rgba(232,163,61,0.9); color:#0E1510; }
  .cond-poor{ background: rgba(199,113,74,0.9); color:#0E1510; }
  .cond-unknown{ background: rgba(154,166,156,0.6); color:#0E1510; }

  .updated-line{
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--font-mono);
    margin: -8px 0 20px;
    text-align: right;
  }

  .action-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .capture-btn{
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 15px;
    border-radius: 12px;
    font-family: var(--font-body);
    font-weight:600;
    font-size: 15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .capture-btn:hover{ border-color: var(--moss); }
  .capture-btn:disabled{ opacity: 0.55; cursor:default; }

  .toggle-row{
    display:flex;
    gap: 10px;
  }
  .toggle-card{
    flex:1;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .toggle-card-label{
    font-size: 13px;
    color: var(--text-dim);
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .toggle-switch{
    width: 46px; height: 26px;
    border-radius: 100px;
    background: var(--bg);
    border: 1px solid var(--line);
    position: relative;
    cursor: pointer;
    transition: background .15s ease;
  }
  .toggle-switch.on{ background: var(--amber-dim); border-color: var(--amber); }
  .toggle-knob{
    position:absolute;
    top: 2px; left: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: left .15s ease, background .15s ease;
  }
  .toggle-switch.on .toggle-knob{ left: 22px; background: var(--amber); }

  .status-strip{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    margin-top: auto;
    padding-top: 20px;
  }

  ::selection{ background: var(--moss-dim); }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div class="screen active" id="screen-auth">
  <div class="brand">
    <div class="brand-mark">C</div>
    <div class="brand-name">Canopy</div>
  </div>

  <div class="auth-card">
    <h1 class="auth-title" id="auth-title">Welcome back</h1>
    <p class="auth-sub" id="auth-sub">Sign in to check on your plants.</p>

    <label>Email</label>
    <input type="email" id="auth-email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" id="auth-password" placeholder="••••••••">

    <div class="err" id="auth-error"></div>

    <button class="btn btn-primary" id="auth-submit">Sign in</button>

    <div class="switch-line">
      <span id="switch-text">Don't have an account?</span>
      <button id="switch-btn">Sign up</button>
    </div>
  </div>
</div>

<!-- ================= DEVICES SCREEN ================= -->
<div class="screen" id="screen-devices">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-name">Canopy</div>
    </div>
    <button class="signout" id="signout-btn">Sign out</button>
  </div>

  <p class="section-label">Your devices</p>
  <div id="device-list"></div>

  <div class="add-row">
    <input type="text" id="manual-mac" placeholder="AA:BB:CC:DD:EE:FF">
    <button class="icon-btn" id="scan-qr-btn" title="Scan QR">▤</button>
    <button class="icon-btn" id="add-mac-btn" title="Add">+</button>
  </div>
</div>

<!-- ================= DASHBOARD SCREEN ================= -->
<div class="screen" id="screen-dashboard">
  <div class="back-row">
    <button class="back-btn" id="back-btn">←</button>
    <div class="device-title" id="dash-mac">--</div>
  </div>

  <div class="photo-frame">
    <img id="dash-image" style="display:none;" crossorigin="anonymous">
    <div class="photo-placeholder" id="dash-placeholder">No image yet — tap Capture Image below.</div>
    <div class="condition-badge cond-unknown" id="condition-badge" style="display:none;">—</div>
  </div>
  <div class="updated-line" id="dash-updated"></div>

  <div class="action-grid">
    <button class="capture-btn" id="capture-btn">📷 Capture image</button>
  </div>

  <div class="toggle-row">
    <div class="toggle-card">
      <div class="toggle-card-label">💧 Sprinkler</div>
      <div class="toggle-switch" id="sprinkler-toggle"><div class="toggle-knob"></div></div>
    </div>
    <div class="toggle-card">
      <div class="toggle-card-label">💡 Light</div>
      <div class="toggle-switch" id="light-toggle"><div class="toggle-knob"></div></div>
    </div>
  </div>

  <div class="status-strip" id="status-strip">waiting for device...</div>
</div>

<!-- ================= QR MODAL ================= -->
<div class="modal-backdrop" id="qr-modal">
  <div class="modal">
    <h3>Scan device QR code</h3>
    <div id="qr-reader"></div>
    <button class="btn btn-ghost" id="close-qr-btn" style="margin-top:14px;">Cancel</button>
  </div>
</div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBHqKOaUzsJE10j_qwdqG9cPBVXI7LrXS4",
  authDomain: "tree-pest.firebaseapp.com",
  databaseURL: "https://tree-pest-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tree-pest",
  storageBucket: "tree-pest.firebasestorage.app",
  messagingSenderId: "970077709184",
  appId: "1:970077709184:web:bdd7a56da2c8010d809765",
  measurementId: "G-HKSRKCWNQR"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ================= STATE ================= */
let isSignUp = false;
let currentUser = null;
let currentDeviceKey = null;
let deviceListeners = {};
let html5QrCode = null;

/* ================= HELPERS ================= */
function show(screenId){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}
function macToKey(mac){
  return mac.trim().toUpperCase().replace(/:/g, "_");
}
function keyToMac(key){
  return key.replace(/_/g, ":");
}

/* ================= AUTH ================= */
document.getElementById('switch-btn').addEventListener('click', () => {
  isSignUp = !isSignUp;
  document.getElementById('auth-title').textContent = isSignUp ? "Create account" : "Welcome back";
  document.getElementById('auth-sub').textContent = isSignUp ? "Set up access to your plant devices." : "Sign in to check on your plants.";
  document.getElementById('auth-submit').textContent = isSignUp ? "Sign up" : "Sign in";
  document.getElementById('switch-text').textContent = isSignUp ? "Already have an account?" : "Don't have an account?";
  document.getElementById('switch-btn').textContent = isSignUp ? "Sign in" : "Sign up";
  document.getElementById('auth-error').textContent = "";
});

document.getElementById('auth-submit').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = "";

  if(!email || !password){
    errEl.textContent = "Enter an email and password.";
    return;
  }

  try{
    if(isSignUp){
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  }catch(e){
    errEl.textContent = e.message.replace("Firebase: ", "");
  }
});

document.getElementById('signout-btn').addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user){
    show('screen-devices');
    loadDevices();
  } else {
    show('screen-auth');
  }
});

/* ================= DEVICE LIST ================= */
function loadDevices(){
  const listEl = document.getElementById('device-list');
  db.ref('users/' + currentUser.uid + '/devices').on('value', snap => {
    const data = snap.val() || {};
    const keys = Object.keys(data);

    if(keys.length === 0){
      listEl.innerHTML = '<div class="empty-state">No devices yet. Scan a QR code or enter a MAC address below to add one.</div>';
      return;
    }

    listEl.innerHTML = "";
    keys.forEach(key => {
      const card = document.createElement('div');
      card.className = 'device-card';
      card.innerHTML = `
        <div>
          <div class="device-mac">${keyToMac(key)}</div>
          <div class="device-sub">Tap to open</div>
        </div>
        <div class="dot"></div>
      `;
      card.addEventListener('click', () => openDevice(key));
      listEl.appendChild(card);
    });
  });
}

function addDevice(mac){
  if(!/^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/.test(mac.trim())){
    alert("That doesn't look like a valid MAC address (format: AA:BB:CC:DD:EE:FF).");
    return;
  }
  const key = macToKey(mac);
  db.ref('users/' + currentUser.uid + '/devices/' + key).set(true);
  document.getElementById('manual-mac').value = "";
}

document.getElementById('add-mac-btn').addEventListener('click', () => {
  const val = document.getElementById('manual-mac').value;
  if(val) addDevice(val);
});

/* ================= QR SCAN ================= */
document.getElementById('scan-qr-btn').addEventListener('click', () => {
  document.getElementById('qr-modal').classList.add('active');
  html5QrCode = new Html5Qrcode("qr-reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 220 },
    (decodedText) => {
      addDevice(decodedText);
      closeQrModal();
    },
    () => {}
  ).catch(err => {
    alert("Couldn't access the camera. Note: camera scanning needs the page loaded over https:// (not a local file).");
    closeQrModal();
  });
});

function closeQrModal(){
  document.getElementById('qr-modal').classList.remove('active');
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
    html5QrCode = null;
  }
}
document.getElementById('close-qr-btn').addEventListener('click', closeQrModal);

/* ================= DASHBOARD ================= */
function openDevice(key){
  currentDeviceKey = key;
  document.getElementById('dash-mac').textContent = keyToMac(key);
  show('screen-dashboard');
  listenToDevice(key);
}

document.getElementById('back-btn').addEventListener('click', () => {
  if(currentDeviceKey){
    db.ref('devices/' + currentDeviceKey + '/status').off();
  }
  show('screen-devices');
});

function listenToDevice(key){
  db.ref('devices/' + key + '/status').on('value', snap => {
    const status = snap.val() || {};
    updateDashboard(status);
  });
}

function updateDashboard(status){
  const img = document.getElementById('dash-image');
  const placeholder = document.getElementById('dash-placeholder');
  const badge = document.getElementById('condition-badge');
  const updatedLine = document.getElementById('dash-updated');
  const statusStrip = document.getElementById('status-strip');

  if(status.imageUrl){
    img.src = status.imageUrl;
    img.style.display = 'block';
    placeholder.style.display = 'none';
    img.onload = () => analyzePlantColor(img, badge);
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'block';
    badge.style.display = 'none';
  }

  if(status.lastUpdate){
    updatedLine.textContent = "Updated " + new Date(status.lastUpdate).toLocaleString();
  }

  statusStrip.textContent = status.lastSeen
    ? "Device last checked in " + new Date(status.lastSeen).toLocaleTimeString()
    : "waiting for device...";

  // Sync toggles with real device-reported state (without re-triggering writes)
  setToggleVisual('sprinkler-toggle', !!status.sprinkler);
  setToggleVisual('light-toggle', !!status.light);
}

function setToggleVisual(id, on){
  const el = document.getElementById(id);
  el.classList.toggle('on', on);
  el.dataset.on = on ? "1" : "0";
}

/* ---- Plant condition: simple color analysis on canvas ---- */
function analyzePlantColor(imgEl, badgeEl){
  try{
    const canvas = document.createElement('canvas');
    const w = canvas.width = 80;
    const h = canvas.height = 60;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h).data;

    let greenScore = 0, brownScore = 0, total = 0;

    for(let i = 0; i < data.length; i += 4){
      const r = data[i], g = data[i+1], b = data[i+2];
      total++;
      // green-dominant pixel (healthy leaf tissue)
      if(g > r + 12 && g > b + 12){
        greenScore++;
      }
      // brown/yellow dominant pixel (wilting, dry, dead tissue)
      else if(r > 100 && g > 60 && b < g && r > b + 20 && g < r){
        brownScore++;
      }
    }

    const greenRatio = greenScore / total;
    const brownRatio = brownScore / total;

    badgeEl.style.display = 'block';
    badgeEl.className = 'condition-badge';

    if(greenRatio > 0.28 && brownRatio < 0.15){
      badgeEl.textContent = "Healthy";
      badgeEl.classList.add('cond-healthy');
    } else if(brownRatio > 0.30){
      badgeEl.textContent = "Poor condition";
      badgeEl.classList.add('cond-poor');
    } else {
      badgeEl.textContent = "Needs attention";
      badgeEl.classList.add('cond-attention');
    }
  }catch(e){
    badgeEl.style.display = 'block';
    badgeEl.className = 'condition-badge cond-unknown';
    badgeEl.textContent = "Unknown";
  }
}

/* ---- Capture button ---- */
document.getElementById('capture-btn').addEventListener('click', () => {
  if(!currentDeviceKey) return;
  const btn = document.getElementById('capture-btn');
  btn.disabled = true;
  btn.textContent = "Requesting capture...";

  db.ref('devices/' + currentDeviceKey + '/commands/capture').set(true);

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = "📷 Capture image";
  }, 4000);
});

/* ---- Sprinkler / Light toggles ---- */
function wireToggle(id, commandField){
  const el = document.getElementById(id);
  el.addEventListener('click', () => {
    if(!currentDeviceKey) return;
    const nextState = el.dataset.on === "1" ? false : true;
    db.ref('devices/' + currentDeviceKey + '/commands/' + commandField).set(nextState);
  });
}
wireToggle('sprinkler-toggle', 'sprinkler');
wireToggle('light-toggle', 'light');
</script>
