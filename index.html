<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy Watch — Capture Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10140F;
    --panel:#171D14;
    --panel-2:#1E251A;
    --ink:#ECE8DA;
    --muted:#8B9482;
    --amber:#E8A33D;
    --leaf:#7FAE7A;
    --line:rgba(232,230,218,0.09);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(127,174,122,0.07), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(232,163,61,0.05), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1120px;margin:0 auto;}

  /* ---------- console header ---------- */
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.16em;
    color:var(--leaf);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,40px);
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }
  .console{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 20px;
    margin-bottom:28px;
  }
  .status-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--muted);
    flex-shrink:0;
  }
  .dot.online{
    background:var(--leaf);
    box-shadow:0 0 0 0 rgba(127,174,122,0.6);
    animation:pulse 2.2s ease-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .dot.online{animation:none;} }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(127,174,122,0.45);}
    70%{box-shadow:0 0 0 8px rgba(127,174,122,0);}
    100%{box-shadow:0 0 0 0 rgba(127,174,122,0);}
  }
  .status-text{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}
  .status-text b{color:var(--ink);font-weight:500;}
  .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
    border-left:1px solid var(--line);
    padding-left:14px;
  }
  .count b{color:var(--amber);font-weight:500;}

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 20px;
    margin-bottom:28px;
  }
  .control-group{display:flex;align-items:center;gap:11px;}
  .control-label{
    display:flex;
    flex-direction:column;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  .control-label span:first-child{color:var(--ink);}
  .control-state{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;}
  .toggle{
    width:44px;height:24px;
    border-radius:999px;
    background:rgba(232,230,218,0.12);
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
    transition:background 0.18s ease, border-color 0.18s ease;
  }
  .toggle[aria-checked="true"]{background:rgba(127,174,122,0.32);border-color:rgba(127,174,122,0.5);}
  .toggle-knob{
    position:absolute;top:2px;left:2px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--muted);
    transition:transform 0.18s ease, background 0.18s ease;
  }
  .toggle[aria-checked="true"] .toggle-knob{transform:translateX(20px);background:var(--leaf);}
  .toggle:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ .toggle, .toggle-knob{transition:none;} }
  .capture-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink);
    background:rgba(232,230,218,0.06);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    transition:border-color 0.18s ease, background 0.18s ease;
  }
  .capture-btn:hover{border-color:rgba(232,230,218,0.28);background:rgba(232,230,218,0.1);}
  .capture-btn:disabled{opacity:0.5;cursor:default;}
  .capture-btn:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;}

  /* ---------- gallery ---------- */
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .card{
    position:relative;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.18s ease, border-color 0.18s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(232,230,218,0.2);
  }
  .card:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ .card{transition:none;} .card:hover{transform:none;} }
  .card img{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    background:#0c0f0a;
  }
  .stamp{
    position:absolute;
    left:8px;
    bottom:8px;
    right:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:5px 9px;
    border-radius:6px;
    background:rgba(10,12,8,0.62);
    backdrop-filter:blur(2px);
    color:var(--ink);
  }
  .stamp .reason{
    font-weight:500;
    letter-spacing:0.03em;
  }
  .stamp .reason.pest{color:var(--amber);}
  .stamp .reason.manual{color:var(--leaf);}
  .stamp .time{color:var(--muted);}

  /* ---------- empty state ---------- */
  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .empty .dot{margin:0 auto 14px;}

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;
    background:rgba(8,10,6,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:50;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    max-width:820px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .lightbox-inner img{width:100%;display:block;max-height:60vh;object-fit:contain;background:#0c0f0a;}
  .lightbox-meta{
    padding:16px 20px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:8px 20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
  }
  .lightbox-meta b{color:var(--ink);font-weight:500;}
  .lightbox-close{
    position:absolute;top:16px;right:16px;
    background:rgba(10,12,8,0.55);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    width:34px;height:34px;
    font-size:16px;
    cursor:pointer;
  }
  .lightbox-close:focus-visible{outline:2px solid var(--leaf);}

  footer{
    max-width:1120px;margin:40px auto 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Field capture log</div>
  <h1>Canopy Watch</h1>

  <div class="console">
    <div class="status-group">
      <span class="dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Connecting…</span>
    </div>
    <div class="count" id="countText"><b>0</b> captures logged</div>
  </div>

  <div class="controls" id="controls">
    <div class="control-group">
      <div class="control-label"><span>Sprinkler</span><span class="control-state" id="sprinklerState">off</span></div>
      <button class="toggle" id="sprinklerToggle" role="switch" aria-checked="false" aria-label="Sprinkler">
        <span class="toggle-knob"></span>
      </button>
    </div>
    <div class="control-group">
      <div class="control-label"><span>Light</span><span class="control-state" id="lightState">off</span></div>
      <button class="toggle" id="lightToggle" role="switch" aria-checked="false" aria-label="Light">
        <span class="toggle-knob"></span>
      </button>
    </div>
    <button class="capture-btn" id="captureBtn">Capture now</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty">Loading capture log…</div>
  </div>
</div>

<footer>Canopy Watch reads <span id="devicePath"></span> in real time and writes toggle/capture commands straight to the device's command queue in Firebase — no refresh needed either way.</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <img id="lightboxImg" src="" alt="Capture">
    <div class="lightbox-meta">
      <div><b id="lbReason"></b></div>
      <div>Captured <b id="lbTime"></b></div>
      <div>Sprinkler: <b id="lbSprinkler"></b></div>
      <div>Light: <b id="lbLight"></b></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
  // ---- Firebase config (public web config — safe to expose client-side) ----
  const firebaseConfig = {
    apiKey: "AIzaSyBHqKOaUzsJE10j_qwdqG9cPBVXI7LrXS4",
    authDomain: "tree-pest.firebaseapp.com",
    databaseURL: "https://tree-pest-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tree-pest",
    storageBucket: "tree-pest.firebasestorage.app",
    messagingSenderId: "970077709184",
    appId: "1:970077709184:web:bdd7a56da2c8010d809765"
  };

  const DEVICE_KEY = "AA_BB_CC_DD_EE_FF";
  const MAX_CAPTURES = 40;
  const ONLINE_THRESHOLD_MS = 40000; // heartbeat is every 15s on-device

  document.getElementById("devicePath").textContent = `/devices/${DEVICE_KEY}/events`;

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const galleryEl = document.getElementById("gallery");
  const countEl = document.getElementById("countText");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  const REASON_LABELS = {
    pest: { label: "Pest detected", cls: "pest" },
    manual: { label: "Manual · web", cls: "manual" },
    manual_button: { label: "Manual · button", cls: "manual" }
  };

  function relativeTime(ms) {
    if (!ms) return "unknown time";
    const diff = Date.now() - ms;
    const s = Math.round(diff / 1000);
    if (s < 5) return "just now";
    if (s < 60) return `${s}s ago`;
    const m = Math.round(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.round(h / 24);
    if (d < 7) return `${d}d ago`;
    return new Date(ms).toLocaleDateString();
  }

  function fullTime(ms) {
    return ms ? new Date(ms).toLocaleString() : "unknown time";
  }

  function renderEvents(events) {
    countEl.innerHTML = `<b>${events.length}</b> captures logged`;

    if (events.length === 0) {
      galleryEl.innerHTML = `
        <div class="empty">
          <div class="dot online" style="margin:0 auto 14px;"></div>
          No captures logged yet. The sensor is watching.
        </div>`;
      return;
    }

    galleryEl.innerHTML = "";
    events.forEach(ev => {
      const meta = REASON_LABELS[ev.reason] || { label: ev.reason || "capture", cls: "manual" };
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `${meta.label} capture, ${relativeTime(ev.timestamp)}`);
      card.innerHTML = `
        <img src="${ev.imageUrl}" alt="" loading="lazy">
        <div class="stamp">
          <span class="reason ${meta.cls}">${meta.label}</span>
          <span class="time">${relativeTime(ev.timestamp)}</span>
        </div>`;
      card.addEventListener("click", () => openLightbox(ev, meta));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(ev, meta); }
      });
      galleryEl.appendChild(card);
    });
  }

  // ---- live listener: recent capture events ----
  const eventsRef = db.ref(`devices/${DEVICE_KEY}/events`).orderByChild("timestamp").limitToLast(MAX_CAPTURES);
  eventsRef.on("value", snapshot => {
    const events = [];
    snapshot.forEach(child => {
      const v = child.val();
      if (v && v.imageUrl) events.push(v);
    });
    events.reverse(); // newest first
    renderEvents(events);
  }, err => {
    galleryEl.innerHTML = `<div class="empty">Couldn't read the capture log. Check the Firebase read rules for /devices/${DEVICE_KEY}/events.</div>`;
    console.error(err);
  });

  // ---- live listener: device status ----
  // lastSeen is the device's own millis() uptime, not wall-clock time, so it's
  // only useful for detecting a *recent* heartbeat, not for showing a real date.
  let lastHeartbeatSeenAt = null;
  const statusRef = db.ref(`devices/${DEVICE_KEY}/status/lastSeen`);
  statusRef.on("value", snapshot => {
    if (snapshot.val() === null) {
      statusText.textContent = "No status yet";
      return;
    }
    lastHeartbeatSeenAt = Date.now();
    statusDot.className = "dot online";
    statusText.textContent = "Online · heartbeat active";
  });

  setInterval(() => {
    if (!lastHeartbeatSeenAt) return;
    if (Date.now() - lastHeartbeatSeenAt > ONLINE_THRESHOLD_MS) {
      statusDot.className = "dot";
      statusText.textContent = "Offline · no recent heartbeat";
    }
  }, 5000);

  // ---- controls: sprinkler / light / capture-now ----
  // Writes go to the same /commands node the device already polls every
  // few seconds, so a toggle here reaches the relay within a couple seconds.
  const commandsRef = db.ref(`devices/${DEVICE_KEY}/commands`);
  const sprinklerToggle = document.getElementById("sprinklerToggle");
  const lightToggle = document.getElementById("lightToggle");
  const sprinklerStateEl = document.getElementById("sprinklerState");
  const lightStateEl = document.getElementById("lightState");
  const captureBtn = document.getElementById("captureBtn");

  function setToggle(btn, stateEl, on) {
    btn.setAttribute("aria-checked", on ? "true" : "false");
    stateEl.textContent = on ? "on" : "off";
  }

  commandsRef.on("value", snapshot => {
    const cmds = snapshot.val() || {};
    setToggle(sprinklerToggle, sprinklerStateEl, !!cmds.sprinkler);
    setToggle(lightToggle, lightStateEl, !!cmds.light);
    if (cmds.capture) {
      captureBtn.disabled = true;
      captureBtn.textContent = "Capturing…";
    } else {
      captureBtn.disabled = false;
      captureBtn.textContent = "Capture now";
    }
  }, err => console.error(err));

  sprinklerToggle.addEventListener("click", () => {
    const next = sprinklerToggle.getAttribute("aria-checked") !== "true";
    commandsRef.child("sprinkler").set(next);
  });
  lightToggle.addEventListener("click", () => {
    const next = lightToggle.getAttribute("aria-checked") !== "true";
    commandsRef.child("light").set(next);
  });
  captureBtn.addEventListener("click", () => {
    commandsRef.child("capture").set(true);
  });

  // ---- lightbox ----
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lightboxImg");
  const lbReason = document.getElementById("lbReason");
  const lbTime = document.getElementById("lbTime");
  const lbSprinkler = document.getElementById("lbSprinkler");
  const lbLight = document.getElementById("lbLight");
  let lastFocused = null;

  function openLightbox(ev, meta) {
    lastFocused = document.activeElement;
    lbImg.src = ev.imageUrl;
    lbReason.textContent = meta.label;
    lbTime.textContent = fullTime(ev.timestamp);
    lbSprinkler.textContent = ev.sprinkler ? "on" : "off";
    lbLight.textContent = ev.light ? "on" : "off";
    lightbox.classList.add("open");
    document.getElementById("lightboxClose").focus();
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
    if (lastFocused) lastFocused.focus();
  }
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
</html>
